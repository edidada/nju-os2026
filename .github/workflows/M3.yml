name: NJU OS 2026 M3
on:
  push:
    branches: [edidada/M3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y strace
      - run: bash ci/verify-m3.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-evidence
          path: evidence/
