name: NJU OS 2026 M2
on:
  push:
    branches: [edidada/M2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/verify-m2.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-evidence
          path: evidence/
