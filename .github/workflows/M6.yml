name: M6 GPT-2 parallel inference
on:
  push:
    branches: [edidada/M6]
  workflow_dispatch:
jobs:
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: gpt/gpt2_124M.bin
          key: nju-os2026-M6-official-model-v1
      - name: Profile and verify
        run: bash ci/verify-m6.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-evidence
          path: evidence/
