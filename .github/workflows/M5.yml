name: NJU OS 2026 M5
on:
  push:
    branches: [edidada/M5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash ci/verify-m5.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-evidence
          path: evidence/
