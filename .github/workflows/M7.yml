name: M7 concurrent CGI HTTP daemon
on:
  push:
    branches: [edidada/M7]
  workflow_dispatch:
jobs:
  httpd:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise real sockets and CGI processes
        run: bash ci/verify-m7.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m7-evidence
          path: evidence/
